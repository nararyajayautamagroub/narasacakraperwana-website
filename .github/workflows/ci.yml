name: CI
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ncrp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx prisma@6.19.3 generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  scraper-config:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npx prisma@6.19.3 generate
      - run: npm run scrape:check